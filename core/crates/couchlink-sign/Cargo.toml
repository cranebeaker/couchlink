[package]
name = "couchlink-sign"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "couchlink-sign"
path = "src/main.rs"

[dependencies]
couchlink-core = { path = "../couchlink-core" }
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
