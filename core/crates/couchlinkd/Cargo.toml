[package]
name = "couchlinkd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
couchlink-core = { path = "../couchlink-core" }
couchlink-steam = { path = "../couchlink-steam" }
couchlink-hook = { path = "../couchlink-hook" }
couchlink-sign = { path = "../couchlink-sign" }
sdl3 = { version = "0.20", features = ["build-from-source-static"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-tungstenite = "0.27"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
ed25519-dalek = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Devices_Display",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
embed-resource = "3"

[[test]]
name = "integration"
harness = false
