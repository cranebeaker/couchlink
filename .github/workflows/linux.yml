# Linux build: tests the Rust workspace (including the input sandbox test with virtual uinput devices),
# builds the Flutter app and packs both into a tarball. Tags (v*) keep the tarball as a release artifact.
name: Linux

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version in the tarball's name (empty for a dev build)
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  # The hook injection tests are Windows only and never run in CI.
  COUCHLINK_SKIP_INJECT_TESTS: "1"

jobs:
  core:
    name: Rust workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            bubblewrap fuse-overlayfs cmake ninja-build pkg-config \
            libudev-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxfixes-dev libxcursor-dev \
            libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libasound2-dev libpulse-dev             xvfb mesa-vulkan-drivers

      - name: gamescope (when the distribution has it)
        run: |
          # The gamescope checks need it; with it installed they are required, so they cannot pass by skipping.
          if sudo apt-get install -y -q --no-install-recommends gamescope; then
            gamescope --version || true
            echo "COUCHLINK_REQUIRE_GAMESCOPE_TEST=1" >> "$GITHUB_ENV"
          else
            echo "::warning::gamescope is not packaged for this runner; the gamescope checks are skipped"
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Let tests make virtual input devices and sandboxes
        run: |
          # Ubuntu 24.04 limits unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo modprobe uinput
          sudo chmod 0666 /dev/uinput
          # Only the test devices (named couchlink-test-...) and Couchlink's virtual pads become readable by the runner
          # user (on a desktop, the logged-in user may read pads anyway).
          printf '%s\n' \
            'SUBSYSTEM=="input", KERNEL=="event*", ATTRS{name}=="couchlink-test-*", MODE="0666"' \
            'SUBSYSTEM=="input", KERNEL=="event*", ATTRS{name}=="*Couchlink player*", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-couchlink-test.rules
          sudo udevadm control --reload-rules
          bwrap --version
          fuse-overlayfs --version | head -1

      - name: Test
        working-directory: core
        env:
          # The sandbox test must run here, never skip.
          COUCHLINK_REQUIRE_SANDBOX_TEST: "1"
        # A virtual X display, so gamescope windows can be placed and checked.
        run: xvfb-run -a -s "-screen 0 1920x1080x24" cargo test --workspace --locked --no-fail-fast -- --nocapture

      - name: Build couchlinkd
        working-directory: core
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=build
        run: cargo build --release --locked -p couchlinkd

      - uses: actions/upload-artifact@v4
        with:
          name: couchlinkd-linux-x64
          path: core/target/release/couchlinkd
          if-no-files-found: error

      # gbe_fork, pinned and hash-checked, laid out the way the tarball ships it (goldberg/ next to couchlinkd).
      - name: Goldberg bundle
        working-directory: core
        run: cargo run --release --locked -p couchlink-steam --example goldberg_bundle -- ../built-goldberg

      - uses: actions/upload-artifact@v4
        with:
          name: goldberg-bundle
          path: built-goldberg
          if-no-files-found: error
          include-hidden-files: true

  game-mode:
    # SteamOS Game Mode shows one window, so the copies go into a nested KWin there: a headless one here, with two
    # windows that couchlinkd's placement must put side by side inside it.
    name: Game Mode nested KWin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            cmake ninja-build pkg-config \
            libudev-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxfixes-dev libxcursor-dev \
            libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libasound2-dev libpulse-dev \
            kwin-wayland xwayland dbus libgl1-mesa-dri libegl1
          command -v kwin_wayland

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Two windows side by side in a nested KWin
        working-directory: core
        env:
          COUCHLINK_REQUIRE_NESTED_TEST: "1"
          # No GPU here: KWin draws with QPainter and its Xwayland without glamor.
          KWIN_COMPOSE: Q
          XWAYLAND_NO_GLAMOR: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p -m 0700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- cargo test -p couchlinkd --bin couchlinkd --locked gamemode_linux -- --nocapture

  gamescope:
    # Ubuntu does not package gamescope; Arch does. The integration test with the copies inside a real gamescope
    # (headless backend, software Vulkan), each player with a virtual keyboard of their own.
    name: gamescope end to end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Let the container make virtual devices and sandboxes
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo modprobe uinput

      - name: Integration test in an Arch container
        run: |
          docker run --rm --privileged -v /dev:/dev -v "$GITHUB_WORKSPACE:/w" -w /w archlinux:latest             bash .github/scripts/arch-e2e.sh gamescope

  proton:
    # A Windows program through umu-launcher (Proton) in gamescope in the sandbox, two seats with a prefix each.
    name: Proton end to end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Let the container make sandboxes
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: umu's runtime and Proton (cached)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/umu-cache
          key: umu-${{ runner.os }}-v2

      - name: Integration test with Proton in an Arch container
        run: |
          mkdir -p "$RUNNER_TEMP/umu-cache"
          docker run --rm --privileged -v /dev:/dev -v "$GITHUB_WORKSPACE:/w" -v "$RUNNER_TEMP/umu-cache:/umu-cache" -w /w             archlinux:latest bash .github/scripts/arch-e2e.sh proton
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/umu-cache"

  windows-check:
    # The Linux port edits shared session files; this keeps the Windows build compiling.
    name: Windows still compiles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Check
        working-directory: core
        run: cargo check --workspace --all-targets --locked

      - name: Pad feed tests on Windows
        # The shared-memory feeds the hook reads, with each seat's profile applied (session/padfeed.rs).
        working-directory: core
        run: cargo test --locked -p couchlinkd --bin couchlinkd padfeed -- --nocapture

  app:
    name: Flutter app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build
        working-directory: app
        run: flutter build linux --release

      - uses: actions/upload-artifact@v4
        with:
          name: couchlink-app-linux-x64
          path: app/build/linux/x64/release/bundle
          if-no-files-found: error

  package:
    name: Tarball
    needs: [core, app]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: couchlinkd-linux-x64
          path: built/couchlinkd

      - uses: actions/download-artifact@v4
        with:
          name: couchlink-app-linux-x64
          path: built/app

      - uses: actions/download-artifact@v4
        with:
          name: goldberg-bundle
          path: built/goldberg

      - name: Pack
        env:
          # Extra words that must never ship (comma separated), kept as a repository secret when set.
          COUCHLINK_PRIVATE_WORDS: ${{ secrets.COUCHLINK_PRIVATE_WORDS }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) version="0.1.3-dev.${GITHUB_SHA::7}" ;; esac
          if [ -n "$INPUT_VERSION" ]; then version="$INPUT_VERSION"; fi
          python3 -I tools/release/package_linux.py --version "$version" \
            --daemon built/couchlinkd/couchlinkd --app-bundle built/app --goldberg built/goldberg

      - uses: actions/upload-artifact@v4
        with:
          name: couchlink-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error
